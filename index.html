<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberal Alliance – valgkort over folketingsvalgene</title>
<meta name="description" content="Interaktivt kort over Liberal Alliances stemmer og kandidaternes personlige stemmer i hele landet – storkreds, kommune og afstemningsområde – ved folketingsvalgene 2026 og 2022.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=2026-10-09d">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" defer></script>
<script src="app.js?v=2026-10-09d" defer></script>
</head>
<body>
<div class="app viz-root">
  <aside class="sidebar" id="sidebar" aria-label="Sidepanel">
    <header class="side-head">
      <h1>Liberal Alliance – valgkort</h1>
      <p class="updated" id="updated"></p>
    </header>
    <nav class="crumbs" id="crumbs" aria-label="Brødkrummer"></nav>
    <div id="side-body"></div>
    <p class="method" id="method"></p>
  </aside>

  <main class="map-wrap" aria-label="Valgkort">
    <div class="toolbar">
      <div class="tb-group" role="group" aria-label="Storkreds">
        <span class="tb-label">Storkreds</span>
        <select id="sk-valg" class="tb-select" aria-label="Storkreds"></select>
      </div>
      <div class="tb-group" role="group" aria-label="Valg">
        <span class="tb-label">Valg</span>
        <div class="map-actions" id="valg-knapper"></div>
      </div>
      <div class="tb-group" role="group" aria-label="Farvning">
        <span class="tb-label">Farv efter</span>
        <div class="map-actions" id="farve-knapper"></div>
        <select id="kandidat-valg" class="tb-select" aria-label="Kandidat" hidden></select>
      </div>
      <div class="tb-group" role="group" aria-label="Inddeling">
        <span class="tb-label">Inddeling</span>
        <div class="map-actions" id="niveau-knapper"></div>
      </div>
    </div>
    <div id="map" class="map"></div>
    <div class="legend-box" id="legend"></div>
  </main>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
